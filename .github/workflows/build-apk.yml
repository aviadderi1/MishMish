name: Build APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'public/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build both apps
        run: gradle --no-daemon -p android assembleManagerRelease assembleDriverRelease
      - name: Collect APKs
        run: |
          mkdir out
          cp android/app/build/outputs/apk/manager/release/*.apk out/manager.apk
          cp android/app/build/outputs/apk/driver/release/*.apk out/driver.apk
          (cd public && zip -qr ../out/web.zip .)
          echo "${{ github.run_number }}" > out/web-version.txt
          cp android/native-version.txt out/native-version.txt
      - uses: actions/upload-artifact@v4
        with: { name: apks, path: out/ }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          SHOWN="1.0.$(( ${{ github.run_number }} - 24 ))"
          gh release create "build-${{ github.run_number }}" out/manager.apk out/driver.apk out/web.zip out/web-version.txt out/native-version.txt --title "גרסה $SHOWN" --notes "מנהל ונהג" --latest
