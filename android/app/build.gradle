plugins { id 'com.android.application' }
// מופעל רק אחרי שמוסיפים את google-services.json מ-Firebase
if (file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }

android {
  namespace 'com.aviad.mishloach'
  compileSdk 34
  defaultConfig {
    minSdk 24
    targetSdk 34
    versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
    versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
  }
  buildFeatures { buildConfig true }
  signingConfigs {
    shared { storeFile file('../signing.jks'); storePassword 'mishmish'; keyAlias 'mishmish'; keyPassword 'mishmish' }
  }
  buildTypes { release { signingConfig signingConfigs.shared; minifyEnabled false } debug { signingConfig signingConfigs.shared } }
  flavorDimensions = ['role']
  productFlavors {
    manager {
      dimension 'role'
      applicationId 'com.aviad.mishloach.manager'
      resValue 'string', 'app_name', 'מנהל משלוחים'
      buildConfigField 'String', 'START_PATH', '"manager/index.html"'
      buildConfigField 'String', 'BAR_COLOR', '"#123C2F"'
    }
    driver {
      dimension 'role'
      applicationId 'com.aviad.mishloach.driver'
      resValue 'string', 'app_name', 'נהג משלוחים'
      buildConfigField 'String', 'START_PATH', '"driver/index.html"'
      buildConfigField 'String', 'BAR_COLOR', '"#0F1A16"'
    }
  }
  sourceSets { main { assets.srcDirs = ['../../public'] } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
  implementation 'androidx.webkit:webkit:1.11.0'
  implementation 'androidx.core:core:1.13.1'
  implementation platform('com.google.firebase:firebase-bom:33.5.1')
  implementation 'com.google.firebase:firebase-messaging'
}
